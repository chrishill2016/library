name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:BuildNumber=${{ github.run_number }}

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/firestore-rules
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/firestore-rules/package-lock.json

      - name: Install
        run: npm ci

      - name: Test security rules
        run: npm test
