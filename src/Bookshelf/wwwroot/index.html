<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4a1a17" />
    <meta name="description" content="Our family library, on the shelf and in your pocket." />
    <title>Bookshelf</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <script>
        // The phone's status bar and the page behind the app follow the chosen theme ("binding").
        // Remembered here so a light theme doesn't flash dark while the app starts.
        window.bookshelfChrome = function (bar, page) {
            document.querySelector('meta[name=theme-color]').setAttribute('content', bar);
            document.documentElement.style.setProperty('--bookshelf-page', page);
            try { localStorage.setItem('bookshelf.chrome', JSON.stringify([bar, page])); } catch (e) { }
        };
        try {
            var saved = JSON.parse(localStorage.getItem('bookshelf.chrome'));
            if (saved) window.bookshelfChrome(saved[0], saved[1]);
        } catch (e) { }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.bookshelfServiceWorker = 'serviceWorker' in navigator
            ? navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).catch(() => null)
            : Promise.resolve(null);
    </script>
</body>

</html>
